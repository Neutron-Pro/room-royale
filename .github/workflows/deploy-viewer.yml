# Workflow pour déployer le contenu statique sur GitHub Pages (Prod et Develop)
name: Deploy History Viewer

on:
  push:
    # Déclenchement sur les deux branches
    branches: ["production", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Attention : on dynamise le groupe de concurrence par branche.
# Cela évite qu'un déploiement de 'develop' n'annule ou bloque un déploiement de 'production'.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Étape intermédiaire : Organiser les dossiers pour le multi-environnement
      - name: Organize build folders
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "Préparation de l'environnement de test (Develop)..."
            mkdir -p dist/develop
            cp -r ./history-viewer/* dist/develop/
          else
            echo "Préparation de l'environnement de production..."
            mkdir -p dist
            cp -r ./history-viewer/* dist/
          fi

      # Configuration de GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload du dossier 'dist' fraîchement configuré
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5